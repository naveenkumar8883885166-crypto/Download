<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise | S. Sri Harini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        <div id="screen-intro" class="screen active">
            <div class="card">
                <div class="profile-frame">
                    <img src="https://via.placeholder.com/100" alt="S. Sri Harini" class="avatar">
                </div>
                <h2>Happy Birthday,<br><span>S. Sri Harini</span>!</h2>
                <p>Today is all about you. Ready for your surprise?</p>
                <button onclick="nextScreen('screen-memories')">Let's Go! ✨</button>
            </div>
        </div>

        <div id="screen-memories" class="screen">
            <h3>Memories with Harini</h3>
            <div class="gallery-grid">
                <div class="photo-slot">📸</div>
                <div class="photo-slot">📸</div>
                <div class="photo-slot">📸</div>
                <div class="photo-slot">📸</div>
            </div>
            <p class="sweet-note">Every moment with you is a gift!</p>
            <button onclick="nextScreen('screen-cake')">Next Surprise 🎂</button>
        </div>

        <div id="screen-cake" class="screen">
            <div class="card">
                <div class="cake-icon">🎂</div>
                <h2>Make a wish, Harini!</h2>
                <p>Close your eyes and tap the button...</p>
                <button onclick="nextScreen('screen-balloons')">Blow out Candles</button>
            </div>
        </div>

        <div id="screen-balloons" class="screen">
            <h2>Pop these for a Message!</h2>
            <div class="balloon-container" id="balloon-box"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
